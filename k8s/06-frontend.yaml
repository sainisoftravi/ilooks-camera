apiVersion: apps/v1
kind: Deployment
metadata:
  name: ilook-frontend
  namespace: ilook-system
  labels:
    app: ilook-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ilook-frontend
  template:
    metadata:
      labels:
        app: ilook-frontend
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: frontend
          image: ilook-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://ilook.labstackops.top/api/v1"
            - name: NEXT_PUBLIC_MEDIAMTX_HOST
              value: "stream.labstackops.top"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ilook-frontend
  namespace: ilook-system
spec:
  selector:
    app: ilook-frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
