apiVersion: apps/v1
kind: Deployment
metadata:
  name: ilook-app
  namespace: ilook-system
  labels:
    app: ilook-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ilook-app
  template:
    metadata:
      labels:
        app: ilook-app
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: app
          image: ilook-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ilook-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ilook-secrets
                  key: SECRET_KEY
            - name: MEDIAMTX_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: ilook-secrets
                  key: MEDIAMTX_WEBHOOK_SECRET
            - name: MEDIAMTX_INGEST_HOST
              value: "stream.labstackops.top"
            - name: MEDIAMTX_INGEST_RTSP_PORT
              value: "8554"
            - name: MEDIAMTX_WHEP_URL
              value: "https://stream.labstackops.top"
            - name: NEXT_PUBLIC_MEDIAMTX_HOST
              value: "stream.labstackops.top"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ilook-app
  namespace: ilook-system
spec:
  selector:
    app: ilook-app
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
