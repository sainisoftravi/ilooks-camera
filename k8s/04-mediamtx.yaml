apiVersion: apps/v1
kind: Deployment
metadata:
  name: ilook-media-gateway
  namespace: ilook-system
  labels:
    app: ilook-media-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ilook-media-gateway
  template:
    metadata:
      labels:
        app: ilook-media-gateway
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: mediamtx
          image: alexxit/go2rtc:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          ports:
            # RTSP Ingestion direct hostPort
            - containerPort: 8554
              hostPort: 8554
              name: rtsp-tcp
              protocol: TCP
            # go2rtc API & WHEP / MSE HTTP streaming port
            - containerPort: 1984
              hostPort: 1984
              name: api-tcp
              protocol: TCP
            # WebRTC UDP ICE direct hostPort
            - containerPort: 8555
              hostPort: 8555
              name: webrtc-udp
              protocol: UDP
          volumeMounts:
            - name: config-volume
              mountPath: /config/go2rtc.yaml
              subPath: go2rtc.yaml
          readinessProbe:
            tcpSocket:
              port: 8554
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8554
            initialDelaySeconds: 5
            periodSeconds: 20
      volumes:
        - name: config-volume
          configMap:
            name: mediamtx-config
---
apiVersion: v1
kind: Service
metadata:
  name: ilook-media-gateway
  namespace: ilook-system
spec:
  type: ClusterIP
  selector:
    app: ilook-media-gateway
  ports:
    - name: rtsp
      port: 8554
      targetPort: 8554
      protocol: TCP
    - name: api
      port: 1984
      targetPort: 1984
      protocol: TCP
    - name: whep
      port: 8889
      targetPort: 1984
      protocol: TCP
    - name: hls
      port: 8888
      targetPort: 1984
      protocol: TCP
    - name: webrtc-ice
      port: 8555
      targetPort: 8555
      protocol: UDP
    - name: webrtc-ice-legacy
      port: 8189
      targetPort: 8555
      protocol: UDP
