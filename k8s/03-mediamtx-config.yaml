apiVersion: v1
kind: ConfigMap
metadata:
  name: mediamtx-config
  namespace: ilook-system
data:
  go2rtc.yaml: |
    # ==============================================================================
    # iLook Cloud Media Gateway (Powered by go2rtc - ARM64 / AMD64)
    # Ultra-low-latency Universal Streaming Engine (WebRTC, WHEP, MSE, RTSP, HLS)
    # ==============================================================================
    api:
      listen: ":1984"

    rtsp:
      listen: ":8554"

    webrtc:
      listen: ":8555"
      candidates:
        - stun:stun.l.google.com:19302
        - stun:stun1.l.google.com:19302
        - stun:stun2.l.google.com:19302
