apiVersion: v1
kind: ConfigMap
metadata:
  name: mediamtx-config
  namespace: ilook-system
data:
  mediamtx.yml: |
    ###############################################
    # iLook Cloud Media Engine (MediaMTX ARM64)
    ###############################################
    logLevel: info
    logDestinations: [stdout]

    # Global HTTP Authentication Webhook routed to unified Next.js App
    authMethod: http
    authHTTPAddress: http://ilook-app.ilook-system.svc.cluster.local:3000/api/v1/mediamtx/auth
    authHTTPExclude:
      - action: api

    # RTSP Ingestion Server
    rtsp: yes
    protocols: [tcp]
    rtspAddress: :8554

    # WebRTC / WHEP Server
    webrtc: yes
    webrtcAddress: :8889
    webrtcEncryption: no
    webrtcAllowOrigins: ['*']
    webrtcAdditionalHosts: ['stream.labstackops.top']
    webrtcICEUDPMuxAddress: :8189

    # Disable unused protocols
    rtmp: no
    hls: no
    srt: no

    # Path template for all camera streams
    paths:
      all:
        runOnReady: curl -s -X POST http://ilook-app.ilook-system.svc.cluster.local:3000/api/v1/mediamtx/event -H "Content-Type: application/json" -d '{"type":"ready","path":"$MTX_PATH"}'
        runOnNotReady: curl -s -X POST http://ilook-app.ilook-system.svc.cluster.local:3000/api/v1/mediamtx/event -H "Content-Type: application/json" -d '{"type":"notReady","path":"$MTX_PATH"}'
